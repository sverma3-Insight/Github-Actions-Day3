name: Azure OIDC Deployment

on:
  workflow_dispatch:
    inputs:
      resource_group_name:
        description: "Azure Resource Group name"
        required: true
        default: "rg-github-actions-day3"

      location:
        description: "Azure location"
        required: true
        default: "centralindia"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name "${{ inputs.resource_group_name }}" \
              --location "${{ inputs.location }}"

      - name: Create Virtual Network
        uses: azure/cli@v2
        with:
          inlineScript: |
            az network vnet create \
              --resource-group "${{ inputs.resource_group_name }}" \
              --name "vnet-github-actions-day3" \
              --address-prefixes "10.30.0.0/16" \
              --subnet-name "subnet-day3" \
              --subnet-prefixes "10.30.1.0/24"

      - name: Create Network Security Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az network nsg create \
              --resource-group "${{ inputs.resource_group_name }}" \
              --name "nsg-github-actions-day3" \
              --location "${{ inputs.location }}"

      - name: Verify deployed resources
        uses: azure/cli@v2
        with:
          inlineScript: |
            az resource list \
              --resource-group "${{ inputs.resource_group_name }}" \
              --output table